[project]
name = "flyrank-capstone-image-relevance"
version = "0.1.0"
description = "Local YOLO image understanding and article matching"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.12,<3",
    "pillow>=11,<13",
    "ultralytics>=8.4.21,<9",
    "transformers>=5.2,<6",
    "sentence-transformers>=5.2,<6",
    "torch>=2.7,<3",
    "torchvision>=0.22,<1",
    "filelock>=3.20,<4",
]

[project.scripts]
image-relevance = "image_relevance.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
image_relevance = ["migrations/*.sql"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
