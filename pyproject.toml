[project]
name = "flyrank-capstone-image-relevance"
version = "0.1.0"
description = "Local YOLO image understanding and article matching"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "pillow>=11,<13"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
